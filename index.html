<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elden Ring Checklist</title>
  <meta name="description" content="Elden Ring save checklist" />
  <link rel="icon" href="assets/img/favicon.ico" />
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/new_style.css" />
</head>

<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="hero">
    <img src="assets/img/logo.webp" alt="Elden Ring" class="hero-logo" />
  </header>

  <main class="shell">
    <div class="top-grid">
      <section class="panel controls">
        <div class="panel-title">Save File</div>

        <label class="er-button file-button" for="savefile">
          <span class="er-button-mark"></span>
          <span>Chọn file save (.sl2)</span>
        </label>
        <input type="file" id="savefile" accept=".sl2, .co2" hidden />
        <div id="cloud_status" class="cloud-status"></div>

        <div id="slot_select" style="display: none"></div>

        <div id="setting_buttons" style="display: none">
          <div class="toggle-row">
            <label class="toggle"><input type="checkbox" id="altered-armor" autocomplete="off" /><span>Altered armor</span></label>
          </div>
        </div>

        <div id="calculate" style="display: none">
          <button type="button" class="er-button er-button-primary" onclick="calculate()">
            <span class="er-button-mark"></span><span>Calculate</span>
          </button>
        </div>
      </section>

      <section id="char_stats" class="panel stats-panel" style="display: none"></section>
    </div>

    <section class="results">
      <div id="source_tabs" class="source-tabs" role="tablist" style="display: none"></div>
      <div id="collapse_button1" style="display: none">
        <button class="section-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#owned">
          <h2>Owned</h2>
        </button>
      </div>
      <div class="collapse" id="owned"></div>

      <div id="collapse_button2" style="display: none">
        <button class="section-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#not-owned">
          <h2>Not Owned</h2>
        </button>
      </div>
      <div class="collapse" id="not-owned"></div>
    </section>
  </main>

  <footer class="credit">
    Lấy cảm hứng và fork từ
    <a href="https://github.com/CyberGiant7/Elden-Ring-Automatic-Checklist" target="_blank" rel="noopener">CyberGiant7/Elden-Ring-Automatic-Checklist</a>
    · Wiki: <a href="https://eldenring.wiki.gg/" target="_blank" rel="noopener">wiki.gg</a>
    · Vị trí: <a href="https://mapgenie.io/elden-ring" target="_blank" rel="noopener">Map Genie</a>
  </footer>

  <button type="button" id="btn-back-to-top" aria-label="Lên đầu trang">↑</button>

  <script src="assets/js/script.js"></script>
  <script src="assets/js/button_to_top.js"></script>
  <script src="assets/js/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/cloud.js"></script>
  <script src="assets/bootstrap/js/bootstrap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.lazy/1.7.9/jquery.lazy.min.js"></script>
  <script>
    document.querySelector(".backdrop").style.backgroundImage =
      `url(assets/img/bg${Math.floor(Math.random() * 6)}.webp)`;
  </script>
</body>

</html>
